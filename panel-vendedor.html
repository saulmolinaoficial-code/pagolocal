<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Vendedor • Pago Local (Compuland MX)</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding: 20px 16px; }
    .layout { max-width: 1020px; margin: 0 auto; display: grid; grid-template-columns: 1fr 380px; gap: 20px; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

    .card { background: #fff; border-radius: 18px; padding: 22px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06); display: flex; flex-direction: column; gap: 14px; }
    h1 { font-size: 20px; font-weight: 800; }
    h2 { font-size: 16px; font-weight: 800; }
    .sub { font-size: 13px; color: #64748b; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .row-2 { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #475569; }
    .field input, .field select { padding: 11px 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 14px; }

    .check-row { display: flex; align-items: center; gap: 8px; background: #fefce8; border: 1px solid #fde047; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; }

    .btn { padding: 12px 15px; border-radius: 11px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; }
    .btn-primary { background: #0f172a; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-light { background: #e2e8f0; color: #0f172a; }

    .qr-box { display: flex; flex-direction: column; align-items: center; gap: 10px; background: #f8fafc; border: 1px dashed #94a3b8; border-radius: 14px; padding: 16px; }
    .url-display { background: #f1f5f9; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; word-break: break-all; width: 100%; border: 1px solid #cbd5e1; }

    .client-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
    .client-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 13px; flex-wrap: wrap; }
    .badge { font-size: 10px; padding: 2px 7px; border-radius: 999px; font-weight: 700; background: #dcfce7; color: #166534; }
    .badge-off { background: #fee2e2; color: #991b1b; }
    .status-msg { font-size: 13px; font-weight: 700; padding: 10px; border-radius: 9px; display: none; }
  </style>
</head>
<body>

<div class="layout">
  <div class="card">
    <div>
      <h1>🛠️ Pago Local • Panel de Vendedor</h1>
      <p class="sub">Soporte by Compuland MX — Google Sheets + Apps Script + Vercel.</p>
    </div>

    <div class="row-2">
      <div class="field">
        <label>Clave de Vendedor (ADMIN_KEY)</label>
        <input type="password" id="admin-key" placeholder="Tu clave en Código.gs">
      </div>
      <div class="field">
        <label>ID Único del QR (slug sin espacios)</label>
        <input type="text" id="slug" oninput="actualizarVistaPrevia()" placeholder="ej: panorama">
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label>Nombre del Negocio</label>
        <input type="text" id="nombre" oninput="autocompletarSlug(); actualizarVistaPrevia();" placeholder="Ej. Panorama">
      </div>
      <div class="field">
        <label>Tema Visual</label>
        <select id="tema" onchange="actualizarVistaPrevia()">
          <option value="luz">✨ Luz Dorada</option>
          <option value="noche">🌙 Azul Noche</option>
          <option value="geometrico">👓 Geométrico</option>
          <option value="terra">☕ Terra Café</option>
          <option value="menta">🌿 Menta Salud</option>
          <option value="pop">🎨 Pop Creativo</option>
          <option value="cyber">⚡ Cyber Neón</option>
          <option value="aurora">🌌 Aurora Cristal</option>
          <option value="titanio">🚀 Titanio Pro</option>
          <option value="solar">🔥 Solar Carbono</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Logo (vacío = Panorama, iniciales como "TG" o URL de imagen)</label>
      <input type="text" id="logo" placeholder="panorama">
    </div>

    <div class="row-2">
      <div class="field">
        <label>Banco y Titular</label>
        <input type="text" id="banco" placeholder="BBVA Bancomer • Víctor Hugo Peña">
      </div>
      <div class="field">
        <label>CLABE Interbancaria (18 dígitos)</label>
        <input type="text" id="clabe" placeholder="012180015489234567">
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label>WhatsApp del Comercio (521 + 10 dígitos)</label>
        <input type="text" id="wa" placeholder="5215512345678">
      </div>
      <div class="field">
        <label>Link Pago con Tarjeta (opcional)</label>
        <input type="text" id="tarjeta" placeholder="https://mpago.la/...">
      </div>
    </div>

    <div class="check-row">
      <input type="checkbox" id="plan-soporte">
      <label for="plan-soporte">Plan Soporte & Publicidad Mensual activo (Compuland MX)</label>
    </div>

    <div class="row-2">
      <div class="field">
        <label>Promo / Publicidad del Mes (opcional)</label>
        <input type="text" id="promo" placeholder="Ej. 2x1 en micas antirreflejantes">
      </div>
      <div class="field">
        <label>Enlace de la Promo (opcional)</label>
        <input type="text" id="promo-link" placeholder="https://instagram.com/...">
      </div>
    </div>

    <div id="status-msg" class="status-msg"></div>

    <div class="row-2">
      <button class="btn btn-primary" onclick="guardarComercio()">💾 Guardar en Google Sheets</button>
      <button class="btn btn-light" onclick="cargarListaClientes()">🔄 Cargar Comercios</button>
    </div>

    <div>
      <h2 style="margin-bottom:8px;">📋 Comercios en Google Sheets</h2>
      <div class="client-list" id="client-list">
        <p class="sub">Ingresa tu clave arriba y presiona "Cargar Comercios".</p>
      </div>
    </div>
  </div>

  <div class="card" style="height: fit-content;">
    <h2>📱 Código QR del Mostrador</h2>
    <p class="sub">Pago Local • Soporte by Compuland MX</p>

    <div class="qr-box">
      <canvas id="qr-canvas"></canvas>
      <button class="btn btn-green" style="width:100%;" onclick="descargarQR()">⬇️ Descargar QR (PNG)</button>
    </div>

    <div class="field">
      <label>Enlace fijo del comercio:</label>
      <div class="url-display" id="url-fija"></div>
    </div>

    <button class="btn btn-blue" onclick="copiarEnlace()">🔗 Copiar Enlace</button>
    <a id="btn-abrir-vista" href="#" target="_blank" class="btn btn-light">👁️ Abrir Pantalla del Cliente</a>
  </div>
</div>

<script src="config.js"></script>
<script>
  const APP_CFG = window.PAGO_LOCAL_CONFIG || { apiUrl: "" };
  let slugEditadoManual = false;
  let CACHE_CLIENTES = [];

  document.getElementById("slug").addEventListener("input", () => { slugEditadoManual = true; });

  function autocompletarSlug() {
    if (slugEditadoManual) return;
    const nombre = document.getElementById("nombre").value;
    const slug = nombre.toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-|-$/g, "");
    document.getElementById("slug").value = slug;
  }

  function obtenerUrlCliente() {
    const slug = document.getElementById("slug").value.trim() || "panorama";
    const base = window.location.origin + window.location.pathname.replace("panel-vendedor.html", "pagar.html");
    return `${base}?id=${encodeURIComponent(slug)}`;
  }

  function actualizarVistaPrevia() {
    const url = obtenerUrlCliente();
    document.getElementById("url-fija").innerText = url;
    document.getElementById("btn-abrir-vista").href = url;
    if (window.QRCode) {
      QRCode.toCanvas(document.getElementById("qr-canvas"), url, { width: 200, margin: 2 });
    }
  }

  function mostrarMensaje(texto, ok) {
    const box = document.getElementById("status-msg");
    box.style.display = "block";
    box.style.background = ok ? "#dcfce7" : "#fee2e2";
    box.style.color = ok ? "#166534" : "#991b1b";
    box.innerText = texto;
  }

  function validarApiUrl() {
    if (!APP_CFG.apiUrl || APP_CFG.apiUrl.includes("PEGA_AQUI_TU_URL_DE_APPS_SCRIPT")) {
      mostrarMensaje("⚠️ Primero pega la URL de tu Web App de Google Apps Script en config.js.", false);
      return false;
    }
    return true;
  }

  async function guardarComercio() {
    if (!validarApiUrl()) return;
    const payload = {
      action: "save",
      adminKey: document.getElementById("admin-key").value.trim(),
      slug: document.getElementById("slug").value.trim(),
      nombre_comercio: document.getElementById("nombre").value.trim(),
      tema_visual: document.getElementById("tema").value,
      logo_personalizado: document.getElementById("logo").value.trim(),
      banco_titular: document.getElementById("banco").value.trim(),
      clabe: document.getElementById("clabe").value.trim(),
      whatsapp: document.getElementById("wa").value.trim(),
      link_tarjeta: document.getElementById("tarjeta").value.trim(),
      plan_soporte: document.getElementById("plan-soporte").checked ? 1 : 0,
      promo_texto: document.getElementById("promo").value.trim(),
      promo_link: document.getElementById("promo-link").value.trim()
    };

    try {
      const res = await fetch(APP_CFG.apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.ok) {
        mostrarMensaje(`✅ Comercio "${payload.nombre_comercio}" guardado en Google Sheets.`, true);
        cargarListaClientes();
      } else {
        mostrarMensaje(`❌ ${json.error}`, false);
      }
    } catch (e) {
      mostrarMensaje("❌ Error de conexión con Google Apps Script.", false);
    }
  }

  async function cargarListaClientes() {
    if (!validarApiUrl()) return;
    const key = document.getElementById("admin-key").value.trim();
    try {
      const res = await fetch(`${APP_CFG.apiUrl}?action=list&key=${encodeURIComponent(key)}`);
      const json = await res.json();
      const listEl = document.getElementById("client-list");

      if (!json.ok) {
        mostrarMensaje(`❌ ${json.error}`, false);
        return;
      }

      CACHE_CLIENTES = json.data || [];
      listEl.innerHTML = "";
      CACHE_CLIENTES.forEach((c, idx) => {
        const estaActivo = Number(c.activo) === 1;
        const div = document.createElement("div");
        div.className = "client-item";
        div.innerHTML = `
          <div>
            <strong>${c.nombre_comercio}</strong> <span style="color:#64748b;">(${c.slug})</span>
            <span class="badge ${estaActivo ? '' : 'badge-off'}">${estaActivo ? 'Activo' : 'Suspendido'}</span>
            ${Number(c.plan_soporte) === 1 ? '<span class="badge">Soporte Mensual</span>' : ''}
            <div style="font-size:11px; color:#64748b;">Tema: ${c.tema_visual} • ${c.banco_titular}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-light" style="padding:7px 10px; font-size:12px;" onclick="editarPorIndice(${idx})">Editar</button>
            <button class="btn btn-light" style="padding:7px 10px; font-size:12px;" onclick="cambiarEstado('${c.slug}', ${estaActivo ? 0 : 1})">
              ${estaActivo ? 'Suspender' : 'Activar'}
            </button>
          </div>
        `;
        listEl.appendChild(div);
      });
    } catch (e) {
      mostrarMensaje("❌ No se pudo leer la lista desde Google Apps Script.", false);
    }
  }

  function editarPorIndice(idx) {
    const c = CACHE_CLIENTES[idx];
    if (!c) return;
    slugEditadoManual = true;
    document.getElementById("slug").value = c.slug || "";
    document.getElementById("nombre").value = c.nombre_comercio || "";
    document.getElementById("tema").value = c.tema_visual || "luz";
    document.getElementById("logo").value = c.logo_personalizado || "";
    document.getElementById("banco").value = c.banco_titular || "";
    document.getElementById("clabe").value = c.clabe || "";
    document.getElementById("wa").value = c.whatsapp || "";
    document.getElementById("tarjeta").value = c.link_tarjeta || "";
    document.getElementById("plan-soporte").checked = Number(c.plan_soporte) === 1;
    document.getElementById("promo").value = c.promo_texto || "";
    document.getElementById("promo-link").value = c.promo_link || "";
    actualizarVistaPrevia();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function cambiarEstado(slug, nuevoEstado) {
    if (!validarApiUrl()) return;
    const adminKey = document.getElementById("admin-key").value.trim();
    try {
      const res = await fetch(APP_CFG.apiUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "toggle", adminKey, slug, activo: nuevoEstado })
      });
      const json = await res.json();
      if (json.ok) {
        mostrarMensaje(
          nuevoEstado === 1 ? `✅ "${slug}" reactivado.` : `⏸️ "${slug}" suspendido por falta de pago.`,
          true
        );
        cargarListaClientes();
      } else {
        mostrarMensaje(`❌ ${json.error}`, false);
      }
    } catch (e) {
      mostrarMensaje("❌ Error al cambiar estado", false);
    }
  }

  function descargarQR() {
    const slug = document.getElementById("slug").value.trim() || "qr";
    const link = document.createElement("a");
    link.download = `pago-local-qr-${slug}.png`;
    link.href = document.getElementById("qr-canvas").toDataURL("image/png");
    link.click();
  }

  function copiarEnlace() {
    navigator.clipboard.writeText(obtenerUrlCliente());
    mostrarMensaje("🔗 Enlace copiado al portapapeles.", true);
  }

  actualizarVistaPrevia();
</script>
</body>
</html>
